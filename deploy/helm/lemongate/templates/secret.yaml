{{- include "lemongate.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lemongate.fullname" . }}
  labels:
    {{- include "lemongate.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ .Values.secrets.masterKey | quote }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
  {{- with .Values.oidc.clientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  metrics-token: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lemongate.fullname" . }}-database
  labels:
    {{- include "lemongate.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
{{- end }}
