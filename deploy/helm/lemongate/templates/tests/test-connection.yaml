apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lemongate.fullname" . }}-test
  labels:
    {{- include "lemongate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: busybox:1.37
      command: [wget, -q, -O, -, "http://{{ include "lemongate.fullname" . }}:{{ .Values.service.port }}/health/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
