{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lemongate.fullname" . }}
  labels:
    {{- include "lemongate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lemongate.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lemongate.postgresql.fullname" . }}
  labels:
    {{- include "lemongate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lemongate.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "lemongate.selectorLabels" . | nindent 14 }}
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
{{- end }}
