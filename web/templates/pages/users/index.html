{{define "content"}}
{{with .Data}}
<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  {{template "page-header" dict "Title" "Users" "Sub" "People who can sign in to the console, with their roles, budgets and default model access." "Icon" "user-round-cog"}}
  {{if .CanCreate}}
  <div class="flex gap-2">
    <button class="btn gap-2" hx-get="/ui/users/bulk" hx-target="#modal-body">{{icon "file-up"}} Bulk add</button>
    <button class="btn btn-primary gap-2 shadow-sm" hx-get="/ui/users/new" hx-target="#modal-body">{{icon "user-plus"}} Add user</button>
  </div>
  {{end}}
</div>

<form id="user-filters" class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center" hx-get="/ui/users/table" hx-target="#users-table" hx-trigger="input changed delay:300ms from:input[type=search], change">
  <label class="input w-full sm:max-w-sm">{{icon "search" "opacity-50"}}<input type="search" name="q" placeholder="Search email or name…"></label>
  <select name="role" class="select w-full sm:w-52">
    <option value="">All roles</option>
    {{$r := .Role}}
    {{range .Roles}}<option value="{{.Value}}" {{if eq .Value $r}}selected{{end}}>{{.Label}}</option>{{end}}
  </select>
  <div class="join">
    <input class="join-item btn btn-sm" type="radio" name="status" value="" aria-label="All" checked>
    <input class="join-item btn btn-sm" type="radio" name="status" value="active" aria-label="Active">
    <input class="join-item btn btn-sm" type="radio" name="status" value="blocked" aria-label="Blocked">
  </div>
</form>

<div id="users-table" hx-get="/ui/users/table" hx-trigger="load, refresh-users from:body" hx-include="#user-filters">
  <div class="table-lg-wrap p-6"><div class="flex flex-col gap-3">{{range seq 6}}<div class="skeleton h-10 w-full"></div>{{end}}</div></div>
</div>
{{end}}
{{end}}
